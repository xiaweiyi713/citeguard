name: Publish

on:
  push:
    tags:
      - "v*"
  # Allows re-running a publish after fixing configuration (for example a
  # missing PyPI trusted publisher) without deleting and re-pushing the tag.
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Cache support models
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4
        with:
          path: ~/.cache/huggingface
          key: citeguard-support-models-${{ runner.os }}-${{ hashFiles('uv.lock', 'pyproject.toml') }}

      - name: Install build tooling
        run: python -m pip install --upgrade pip "setuptools>=68" wheel build twine

      - name: Run unit tests
        run: python -m pip install -e . "jsonschema>=4.23,<5" && python -m unittest discover -s tests

      - name: Install production model and PDF reviewers
        run: python -m pip install -e ".[models,pdf]"

      - name: Audit the full release dependency set
        run: python -m pip install "pip-audit>=2.7,<3" && python -m pip_audit --strict

      - name: Run automated release review
        run: >-
          python scripts/automated_release_review.py
          --output automated-release-review.json

      - name: Enforce software-release gate
        run: >-
          python scripts/release_package_gate.py
          --skip-install-smoke
          --require-build-tools
          --release-claim-mode software
          --automated-review-report automated-release-review.json

      - name: Preserve automated review evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: automated-release-review
          path: automated-release-review.json

      - name: Build distributions
        run: python -m build

      - name: Generate release SBOM
        run: python scripts/generate_sbom.py --output citationguard.cdx.json

      - name: Upload distributions
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: dist
          path: dist/

      - name: Upload release SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: citeguard-sbom
          path: citationguard.cdx.json

  publish-pypi:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write

    steps:
      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI (trusted publishing)
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1

  github-release:
    needs: publish-pypi
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Download distributions
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: dist
          path: dist/

      - name: Download release SBOM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: citeguard-sbom
          path: sbom/

      - name: Pick release notes file
        id: notes
        run: |
          NOTES="docs/releases/${GITHUB_REF_NAME}.md"
          if [ -f "$NOTES" ]; then
            echo "body_path=$NOTES" >> "$GITHUB_OUTPUT"
          else
            echo "body_path=" >> "$GITHUB_OUTPUT"
          fi

      - name: Create or update GitHub release (with notes file)
        if: steps.notes.outputs.body_path != ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: CiteGuard ${{ github.ref_name }}
          body_path: ${{ steps.notes.outputs.body_path }}
          files: |
            dist/*
            sbom/citationguard.cdx.json

      - name: Create or update GitHub release (generated notes)
        if: steps.notes.outputs.body_path == ''
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: CiteGuard ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            dist/*
            sbom/citationguard.cdx.json
