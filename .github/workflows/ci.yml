name: CI

on:
  push:
  pull_request:

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Run ruff
        uses: astral-sh/ruff-action@146cd51f235777a9bc491eead18e0d5a4b05406a # v3

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Run mypy
        run: python -m pip install mypy && python -m mypy citeguard/

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package
        run: python -m pip install --upgrade pip "setuptools>=68" wheel && python -m pip install -e . build "jsonschema>=4.23,<5"

      - name: Run unit tests
        run: python -m unittest discover -s tests -v

      - name: Run citation verification eval
        run: python scripts/eval_verification.py

      - name: Validate synthetic support seed provenance (not release readiness)
        run: python scripts/eval_support.py --validate-only --label-sidecar data/eval/support_eval_label_sidecar.json --min-sidecar-coverage 1.0 --min-human-reviewed 0 --min-high-risk-reviewed 0 --min-high-risk-reviewed-by-language zh=0

      - name: Report real human benchmark readiness (collection is intentionally non-blocking)
        run: python scripts/audit_human_support_benchmark.py

      - name: Report real retrieval observation readiness (collection is intentionally non-blocking)
        run: python scripts/audit_live_retrieval_benchmark.py

      - name: Report longitudinal retrieval observation coverage (intentionally non-networked and non-blocking)
        run: python scripts/summarize_live_retrieval_observations.py

      - name: Run deterministic synthetic-seed eval (release summary remains label-immature)
        run: python scripts/eval_support.py --report --split test --label-sidecar data/eval/support_eval_label_sidecar.json --min-sidecar-coverage 1.0 --min-human-reviewed 0 --min-high-risk-reviewed 0 --min-high-risk-reviewed-by-language zh=0 --quality-gate

      - name: Run deterministic support baseline comparison
        run: python scripts/compare_support_baselines.py --split test --min-high-risk-reviewed-by-language zh=0

      - name: Validate support verifier ablation matrix and model availability statuses
        run: python scripts/run_support_ablations.py --split test --plan-only

      - name: Run package install smoke
        if: matrix.python-version == '3.10'
        run: python scripts/smoke_package.py --install-mode wheel

      - name: Run source distribution install smoke
        if: matrix.python-version == '3.10'
        run: python scripts/smoke_package.py --install-mode sdist

      - name: Run release package metadata gate
        if: matrix.python-version == '3.10'
        run: python -m pip install build twine && python scripts/release_package_gate.py --skip-install-smoke --require-build-tools --min-high-risk-reviewed-by-language zh=0

      - name: Run legacy writing-agent heuristic demo evaluation
        run: python legacy/scripts/evaluate.py --topic "citation hallucination in scientific writing" --support-mode heuristic

  mcp-smoke:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.10"

      - name: Install package with MCP extra
        # `build` is required because the wheel install smoke below builds via
        # the PEP 517 frontend rather than the legacy setup.py path.
        run: python -m pip install --upgrade pip && python -m pip install -e ".[mcp]" build

      - name: Run MCP extra wheel install smoke
        run: python scripts/release_package_gate.py --skip-install-smoke --include-mcp-extra-smoke --require-mcp-extra-smoke

      - name: Run MCP stdio release gate smoke
        run: python scripts/release_package_gate.py --skip-install-smoke --include-mcp-stdio-smoke --require-mcp-stdio-smoke

      - name: Run MCP stdio smoke
        run: python scripts/smoke_mcp.py --require-sdk

  supply-chain:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"

      - name: Audit resolved runtime dependencies
        run: >-
          python -m pip install --upgrade pip &&
          python -m pip install -e . "pip-audit>=2.7,<3" &&
          python -m pip_audit --strict

      - name: Generate declared-dependency SBOM
        run: python scripts/generate_sbom.py --output citeguard.cdx.json

      - name: Upload SBOM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: citeguard-sbom
          path: citeguard.cdx.json
